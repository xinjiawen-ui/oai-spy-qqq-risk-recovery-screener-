name: Validate SPY QQQ dashboard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Dashboard HTML and inline JavaScript syntax
        run: |
          python scripts/validate_dashboard.py
          node --check /tmp/dashboard-inline.js
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Python compilation
        run: python -m compileall -q scripts tests
